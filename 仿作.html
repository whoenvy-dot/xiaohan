<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陋室銘仿作互動工具 - 無捲軸版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #f3f0e9;
            background-image: radial-gradient(#d1ccc0 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: hidden; 
            height: 100vh;
            margin: 0;
        }
        .bamboo-bg {
            position: fixed;
            bottom: -10px;
            right: -10px;
            width: 180px;
            opacity: 0.1;
            pointer-events: none;
            z-index: 0;
        }
        .main-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0.75rem;
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }
        .main-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            border: 4px double #8b7355;
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            border-radius: 1.5rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        /* 填空格樣式 */
        .drop-zone {
            min-width: 70px;
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-bottom: 3px dashed #8b7355;
            margin: 0 6px;
            transition: all 0.2s;
            vertical-align: middle;
            color: #c05805;
            font-weight: 900;
            cursor: pointer;
        }
        .drop-zone.active {
            background-color: #fffaf0;
            border-bottom: 3px solid #c05805;
            transform: scale(1.05);
        }
        /* 標籤顯示優化：確保不產生捲軸 */
        #tag-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            align-content: flex-start;
        }
        @keyframes rotate-music {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .music-playing #musicIcon {
            animation: rotate-music 4s linear infinite;
        }
    </style>
</head>
<body>

    <!-- 背景音樂 -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://www.image2url.com/r2/default/audio/1778672697468-4ff58fc5-f363-4c07-a66a-15cc4fa84c25.mp3" type="audio/mpeg">
    </audio>

    <!-- 音樂控制按鈕 -->
    <div class="fixed top-3 right-3 z-50">
        <button id="musicToggle" onclick="toggleMusic()" class="bg-stone-900 text-stone-100 px-4 py-1.5 rounded-full border border-stone-600 shadow-lg flex items-center gap-2 hover:scale-105 transition-all">
            <span id="musicIcon" class="text-lg">🔇</span>
            <span id="musicText" class="text-[10px] tracking-widest font-black">調素琴</span>
        </button>
    </div>

    <div class="bamboo-bg">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M30,100 Q35,50 30,0 M32,100 Q37,50 32,0" stroke="#2d5a27" stroke-width="2" fill="none"/>
        </svg>
    </div>

    <div class="main-container">
        <div class="main-card">
            <!-- 標題區 -->
            <div class="py-3 text-center bg-white/50 border-b border-stone-200">
                <h1 class="text-2xl md:text-3xl font-black text-[#4e342e] tracking-widest flex items-center justify-center gap-3">
                    🎋 陋室銘創意仿作 🎋
                </h1>
            </div>

            <!-- 填空主文區 (高度自適應，字體適中) -->
            <div class="flex-grow flex items-center justify-center px-4">
                <div class="text-xl md:text-3xl leading-[3.5rem] text-stone-800 text-center font-bold">
                    <div class="sentence mb-1">
                        <span class="drop-zone" data-type="object">＿＿</span> 不在 <span class="drop-zone" data-type="attr">＿＿</span>，
                        有 <span class="drop-zone" data-type="core">＿＿</span> 則 <span class="drop-zone" data-type="eval">＿＿</span>。
                    </div>
                    <div class="sentence mb-1">
                        <span class="drop-zone" data-type="object">＿＿</span> 不在 <span class="drop-zone" data-type="attr">＿＿</span>，
                        有 <span class="drop-zone" data-type="core">＿＿</span> 則 <span class="drop-zone" data-type="eval">＿＿</span>。
                    </div>
                    <div class="sentence">
                        斯是 <span class="drop-zone" data-type="space">＿＿</span>，惟吾德 <span class="drop-zone" data-type="eval">＿＿</span>。
                    </div>
                </div>
            </div>

            <!-- 控制與標籤區 (不使用滾動，直接撐開) -->
            <div class="bg-stone-50 p-4 border-t border-stone-200">
                
                <!-- 控制按鈕 -->
                <div class="flex flex-wrap justify-center gap-2 items-center mb-4">
                    <button onclick="clearAll()" class="px-4 py-1.5 bg-stone-500 text-white rounded-lg hover:bg-stone-600 transition font-black text-xs">清空重填</button>
                    <div class="flex items-center gap-1">
                        <input id="custom-input" type="text" placeholder="自撰..." class="px-2 py-1 border border-stone-300 rounded-lg focus:outline-none focus:border-amber-800 text-xs w-24 font-bold">
                        <button onclick="addCustomTag()" class="px-3 py-1 bg-amber-900 text-white rounded-lg hover:bg-black transition font-black text-xs">＋添墨</button>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="loadTheme('school')" class="px-3 py-1 bg-white border border-sky-300 rounded-full text-xs font-black hover:bg-sky-50 text-sky-800">🏫 青春</button>
                        <button onclick="loadTheme('social')" class="px-3 py-1 bg-white border border-pink-300 rounded-full text-xs font-black hover:bg-pink-50 text-pink-800">🤳 數位</button>
                        <button onclick="loadTheme('lazy')" class="px-3 py-1 bg-white border border-orange-300 rounded-full text-xs font-black hover:bg-orange-50 text-orange-800">🛋️ 慵懶</button>
                    </div>
                </div>

                <!-- 標籤池：完全平鋪不捲動 -->
                <div id="tag-pool">
                    <!-- 標籤動態生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const themes = {
            school: [
                { text: '目標', type: 'object' }, { text: '考卷', type: 'object' }, { text: '午餐', type: 'object' }, { text: '座位', type: 'object' },
                { text: '重量', type: 'attr' }, { text: '多寡', type: 'attr' }, { text: '新舊', type: 'attr' }, { text: '前後', type: 'attr' },
                { text: '友誼', type: 'core' }, { text: '實力', type: 'core' }, { text: '重點', type: 'core' }, { text: '夢想', type: 'core' },
                { text: '名', type: 'eval' }, { text: '靈', type: 'eval' }, { text: '堅', type: 'eval' }, { text: '強', type: 'eval' },
                { text: '教室', type: 'space' }, { text: '成績', type: 'space' }, { text: '校園', type: 'space' }, { text: '馨', type: 'eval' }
            ],
            social: [
                { text: '手機', type: 'object' }, { text: '貼文', type: 'object' }, { text: '帳號', type: 'object' }, { text: '濾鏡', type: 'object' },
                { text: '品牌', type: 'attr' }, { text: '流量', type: 'attr' }, { text: '網速', type: 'attr' }, { text: '追蹤', type: 'attr' },
                { text: '品味', type: 'core' }, { text: '真心', type: 'core' }, { text: '創意', type: 'core' }, { text: '勇氣', type: 'core' },
                { text: '狂', type: 'eval' }, { text: '火', type: 'eval' }, { text: '炫', type: 'eval' }, { text: '真', type: 'eval' },
                { text: '雲端', type: 'space' }, { text: '群組', type: 'space' }, { text: '網路', type: 'space' }, { text: '亮', type: 'eval' }
            ],
            lazy: [
                { text: '臥室', type: 'object' }, { text: '泡麵', type: 'object' }, { text: '被窩', type: 'object' }, { text: '沙發', type: 'object' },
                { text: '寬窄', type: 'attr' }, { text: '熱量', type: 'attr' }, { text: '價格', type: 'attr' }, { text: '時間', type: 'attr' },
                { text: '靈魂', type: 'core' }, { text: '自在', type: 'core' }, { text: '食慾', type: 'core' }, { text: '安穩', type: 'core' },
                { text: '順', type: 'eval' }, { text: '爽', type: 'eval' }, { text: '甜', type: 'eval' }, { text: '香', type: 'eval' },
                { text: '角落', type: 'space' }, { text: '客廳', type: 'space' }, { text: '家宅', type: 'space' }, { text: '逸', type: 'eval' }
            ]
        };

        const typeLabels = { object: '物', attr: '性', core: '魂', eval: '評', space: '境', custom: '墨' };
        let currentActiveDropZone = null;

        window.onload = () => {
            loadTheme('school');
            setupDropZones();
        };

        function setupDropZones() {
            const zones = document.querySelectorAll('.drop-zone');
            zones.forEach(zone => {
                zone.addEventListener('click', () => {
                    zones.forEach(z => z.classList.remove('active'));
                    zone.classList.add('active');
                    currentActiveDropZone = zone;
                });
                zone.addEventListener('dragover', (e) => e.preventDefault());
                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const text = e.dataTransfer.getData('text/plain');
                    updateZone(zone, text);
                });
            });
        }

        function updateZone(zone, text) {
            zone.innerText = text;
            zone.style.color = '#1a3a16'; 
            zone.classList.remove('active');
        }

        function loadTheme(themeKey) {
            const pool = document.getElementById('tag-pool');
            pool.innerHTML = '';
            themes[themeKey].forEach(item => createTag(item.text, item.type));
        }

        function createTag(text, type) {
            const pool = document.getElementById('tag-pool');
            const wrapper = document.createElement('div');
            wrapper.className = "flex flex-col items-center mb-1";
            
            const label = document.createElement('span');
            label.className = `text-[8px] font-black ${getCategoryColor(type)} opacity-70 mb-0.5`;
            label.innerText = typeLabels[type] || '墨';

            const tag = document.createElement('div');
            // 標籤大小適中：text-lg，內距適量縮小，確保橫向容納
            tag.className = `bg-white border ${getBorderColor(type)} text-stone-900 px-3 py-1 rounded-lg draggable-item font-black text-lg shadow hover:bg-stone-50 transition-colors`;
            tag.innerText = text;
            tag.draggable = true;
            
            tag.onclick = () => {
                if (currentActiveDropZone) {
                    updateZone(currentActiveDropZone, text);
                    currentActiveDropZone = null;
                }
            };
            
            tag.ondragstart = (e) => { e.dataTransfer.setData('text/plain', text); };

            wrapper.appendChild(label);
            wrapper.appendChild(tag);
            pool.appendChild(wrapper);
        }

        function getCategoryColor(type) {
            const colors = { object: 'text-blue-600', attr: 'text-green-700', core: 'text-red-600', eval: 'text-amber-700', space: 'text-indigo-700' };
            return colors[type] || 'text-stone-600';
        }

        function getBorderColor(type) {
            const colors = { object: 'border-blue-200', attr: 'border-green-200', core: 'border-red-200', eval: 'border-amber-200', space: 'border-indigo-200' };
            return colors[type] || 'border-stone-300';
        }

        function addCustomTag() {
            const input = document.getElementById('custom-input');
            if (input.value.trim()) {
                createTag(input.value.trim(), 'custom');
                input.value = '';
            }
        }

        function clearAll() {
            document.querySelectorAll('.drop-zone').forEach(zone => {
                zone.innerText = '＿＿';
                zone.classList.remove('active');
                zone.style.color = '#c05805';
            });
            currentActiveDropZone = null;
        }

        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            const icon = document.getElementById('musicIcon');
            const btn = document.getElementById('musicToggle');
            if (music.paused) {
                music.play().catch(() => {});
                icon.innerText = '🎶';
                btn.classList.add('music-playing');
            } else {
                music.pause();
                icon.innerText = '🔇';
                btn.classList.remove('music-playing');
            }
        }
    </script>
</body>
</html>
